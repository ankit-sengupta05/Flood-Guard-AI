services:
  - type: web
    name: flood-guard-api
    runtime: python
    rootDir: backend
    buildCommand: "python -m pip install --upgrade pip && python -m pip install --only-binary=:all: -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_ORIGIN
        sync: false
